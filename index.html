<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Noto Serif SC', 'SimSun', serif;
            background: #000;
        }

        /* 视频铺满全屏 */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .video-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 半透明遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
        }

        /* 内容层 */
        .splash-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 12vh;
        }

        .lotus-icon {
            font-size: 3rem;
            color: #d4af37;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .title {
            font-size: 2.2rem;
            color: #d4af37;
            margin-bottom: 6px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8), 0 0 40px rgba(212, 175, 55, 0.4);
            font-weight: 700;
        }

        .subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 25px;
            letter-spacing: 6px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .enter-btn {
            display: inline-block;
            padding: 14px 50px;
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.4);
            border: none;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 2px;
        }

        .enter-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.6);
        }

        .enter-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .mantra {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
        }

        /* 点击提示 */
        .tap-hint {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 3;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* 手机端适配 */
        @media (max-width: 480px) {
            .splash-content {
                padding-bottom: 10vh;
            }
            .lotus-icon {
                font-size: 2.5rem;
            }
            .title {
                font-size: 1.8rem;
            }
            .subtitle {
                font-size: 0.85rem;
                letter-spacing: 4px;
                margin-bottom: 20px;
            }
            .enter-btn {
                padding: 12px 40px;
                font-size: 1rem;
            }
            .mantra {
                font-size: 0.75rem;
            }
        }

        /* 超小屏幕 */
        @media (max-width: 360px) {
            .title {
                font-size: 1.5rem;
            }
            .subtitle {
                font-size: 0.75rem;
                letter-spacing: 3px;
            }
            .enter-btn {
