<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>佛教科普 | 佛经宝库</title>
    <link rel="stylesheet" href="../css/style.css">
    <meta name="description" content="佛教基础知识科普，包括佛教宇宙观、三界六道、修行方法等入门知识">
    <meta name="keywords" content="佛教科普,佛教基础知识,三界六道,佛教宇宙观,佛学入门">
    <meta property="og:title" content="佛教科普 | 佛经宝库">
    <meta property="og:description" content="佛教基础知识科普，包括佛教宇宙观、三界六道、修行方法等入门知识">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://buddhist-sutras.pages.dev/knowledge/">
    <link rel="canonical" href="https://buddhist-sutras.pages.dev/knowledge/">
    <style>
        .knowledge-hero {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            padding: 4rem 2rem;
            text-align: center;
            color: #f5f5f5;
        }
        .knowledge-hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #d4af37, #f4e5c2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .knowledge-hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        .knowledge-grid {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }
        .knowledge-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .knowledge-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        .knowledge-card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .knowledge-card-content {
            padding: 1.5rem;
        }
        .knowledge-card h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: #1a1a2e;
        }
        .knowledge-card p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .knowledge-card-tag {
            display: inline-block;
            background: #d4af37;
            color: #1a1a2e;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="../home.html" class="logo">佛经宝库</a>
            <div class="nav-links">
                <a href="../home.html">首页</a>
                <a href="../home.html#sutras">佛经目录</a>
                <a href="index.html" class="active">佛教科普</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="knowledge-hero">
            <h1>佛教科普</h1>
            <p>了解佛教基础知识，探索佛法智慧。从宇宙观到修行方法，为您呈现清晰易懂的佛学入门知识。</p>
        </section>

        <section class="knowledge-grid">
            <a href="three-realms.html" class="knowledge-card">
                <div class="knowledge-card-image" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                    <img src="three-realms-diagram.svg" alt="三界结构图" style="width: 100%; height: 100%; object-fit: contain; padding: 20px;">
                </div>
                <div class="knowledge-card-content">
                    <h3>佛教宇宙观·三界结构</h3>
                    <p>详解佛教宇宙观中的三界（欲界、色界、无色界）与六道，了解众生轮回的层次结构。</p>
                    <span class="knowledge-card-tag">宇宙观</span>
                </div>
            </a>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 佛经宝库 - 传承佛法智慧</p>
            <nav class="footer-nav">
                <a href="../home.html">首页</a>
                <a href="../home.html#sutras">佛经目录</a>
                <a href="index.html">佛教科普</a>
            </nav>
        </div>
    </footer>
</body>
</html>
